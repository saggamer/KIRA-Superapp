name: Linux preview release
on:
  push:
    tags: ['linux-preview-*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      DIAGONAL_ADBLOCK_AUTO_UPDATE: '0'
      PYWEBVIEW_GUI: qt
      QT_API: pyqt6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Package frozen source
        run: |
          python scripts/package_linux.py
          mkdir -p /tmp/kira-linux-check
          tar -xzf release/linux/*.tar.gz -C /tmp/kira-linux-check
      - name: Install Linux desktop libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-venv python3-dev build-essential portaudio19-dev libportaudio2 libasound2t64 libnss3 libatk-bridge2.0-0 libgtk-3-0t64 libgbm1 libxss1 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-image0 libxcb-render-util0 libxcb-xinerama0 libxkbcommon-x11-0 libegl1 libopengl0 libpulse0 ffmpeg xdg-utils gnome-keyring xvfb
      - name: Install the packaged app
        working-directory: /tmp/kira-linux-check/kira-superapp-linux-preview-2026.11.05
        run: bash INSTALL_LINUX.sh
      - name: Check packaged Python runtime
        working-directory: /tmp/kira-linux-check/kira-superapp-linux-preview-2026.11.05
        run: |
          "$HOME/.local/share/kira-superapp/runtime/bin/python" -m unittest discover -s tests -p test_linux_runtime.py -v
          "$HOME/.local/share/kira-superapp/runtime/bin/python" -m compileall -q interface.py linux_model_worker.py actions.py coding.py voice.py
      - name: Test packaged browser and updated desktop
        working-directory: /tmp/kira-linux-check/kira-superapp-linux-preview-2026.11.05/diagonal_browser
        run: |
          npx playwright install-deps chromium
          xvfb-run -a npm test
          xvfb-run -a npm run test:desktop
      - name: Open packaged KIRA Qt window
        working-directory: /tmp/kira-linux-check/kira-superapp-linux-preview-2026.11.05
        run: xvfb-run -a "$HOME/.local/share/kira-superapp/runtime/bin/python" scripts/smoke_linux_ui.py
      - uses: actions/upload-artifact@v4
        with:
          name: kira-superapp-linux-preview
          path: release/linux/*
      - name: Publish validated preview
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/linux/*.tar.gz release/linux/SHA256SUMS --prerelease --title "KIRA Superapp Linux preview — updated Diagonal Browser" --notes-file docs/LINUX.md
